<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laguna Member Card</title>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: form panel on the left, live card preview on the right; preview first on phones. */
:root {
  --bg: #eef3f2;
  --surface: #fbfdfc;
  --ink: #10302f;
  --muted: #587270;
  --line: #cfdcda;
  --accent: #0e7d79;
  --accent-ink: #ffffff;
  --field: #ffffff;
  --stage: #dfe9e7;
  --danger: #a3361f;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Poppins", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1918; --surface: #122322; --ink: #e5f1ef; --muted: #98b2af; --line: #274240;
    --accent: #43b9b2; --accent-ink: #052120; --field: #0e1e1d; --stage: #0f1f1e; --danger: #ff9b84;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1918; --surface: #122322; --ink: #e5f1ef; --muted: #98b2af; --line: #274240;
  --accent: #43b9b2; --accent-ink: #052120; --field: #0e1e1d; --stage: #0f1f1e; --danger: #ff9b84;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.5 var(--font-body);
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
header { margin-bottom: 24px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
h1 { font: 700 clamp(30px, 5vw, 42px)/1.05 var(--font-display); margin: 0 0 6px; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 60ch; }

.layout { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 32px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 22px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; min-width: 0; }
legend { padding: 0; margin-bottom: 2px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
label { display: grid; gap: 5px; font-weight: 500; font-size: 13px; min-width: 0; }
input[type="text"], input[type="date"], select {
  width: 100%; min-width: 0; font: inherit; font-weight: 400; color: var(--ink);
  background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
}
input:focus-visible, select:focus-visible, button:focus-visible, .photo-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.photo-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.thumb { width: 52px; height: 52px; border-radius: 50%; background: var(--stage) center/cover no-repeat; border: 1px solid var(--line); flex: none; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
button { font: inherit; font-weight: 500; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.06); }
button.link { border: 0; background: none; padding: 4px 2px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
button.link:hover { color: var(--danger); }
button:disabled { opacity: .6; cursor: progress; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions .primary { flex: 1 1 180px; padding-block: 12px; }

.stage { background: var(--stage); border: 1px solid var(--line); border-radius: 14px; padding: clamp(14px, 3vw, 30px); min-width: 0; }
.card-box { position: relative; width: 100%; max-width: 760px; margin: 0 auto; aspect-ratio: 430 / 272; filter: drop-shadow(0 16px 22px rgba(6, 50, 48, .28)); }
#card { display: block; width: 100%; height: 100%; }
.photo-hit {
  position: absolute; left: 43.256%; top: 30.882%; width: 24.186%; height: 38.235%;
  border-radius: 50%; cursor: grab; touch-action: none;
}
.photo-hit.dragging { cursor: grabbing; }
.text-hit { position: absolute; cursor: move; touch-action: none; border-radius: 6px; outline: 1.5px dashed transparent; box-shadow: 0 0 0 0 transparent; }
.text-hit:hover, .text-hit:focus-visible, .text-hit.dragging { outline-color: rgba(255,255,255,.95); box-shadow: 0 0 0 1px rgba(0,50,50,.45); background: rgba(255,255,255,.08); }
.stage-note { text-align: center; margin: 14px 0 0; font-size: 12px; color: var(--muted); }
.status { min-height: 1.5em; font-size: 12px; color: var(--muted); margin: 0; }
.status.warn { color: var(--danger); }
.tools { margin-top: 12px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { order: -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Laguna Golf Bintan</p>
    <h1>MEMBERSHIP CARD</h1>
    <!-- <p class="lead">Isi data member, atur foto, lalu unduh kartu sebagai PDF berukuran 430 × 272 pt sesuai desain asli.</p> -->
  </header>

  <div class="layout">
    <form class="panel" id="form" autocomplete="off">
      <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Name
          <input type="text" id="name" maxlength="60" value="Alfie Akbar Riyadi" spellcheck="false">
        </label>
        <label for="no">Member No
          <input type="text" id="no" maxlength="14" value="A996" spellcheck="false">
        </label>
      </fieldset>

      <fieldset>
        <legend>Validity Period</legend>
        <div class="row">
          <label for="from">Valid from
            <input type="date" id="from" value="2026-10-31">
          </label>
          <label for="years">Duration
            <select id="years">
              <option value="1">1 year</option>
              <option value="2">2 years</option>
              <option value="3" selected>3 years</option>
              <option value="5">5 years</option>
              <option value="0">Set manually</option>
            </select>
          </label>
        </div>
        <label for="thru">Valid thru
          <input type="date" id="thru" value="2029-10-31">
        </label>
      </fieldset>

      <fieldset>
        <legend>Member Photo</legend>
        <div class="photo-row">
          <div class="thumb" id="thumb" aria-hidden="true"></div>
          <button type="button" id="pick">Choose Photo…</button>
          <button type="button" class="link" id="clearPhoto">Remove Photo</button>
        </div>
        <input type="file" id="file" accept="image/*" class="sr" tabindex="-1">
        <label for="zoom">Zoom
          <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
        </label>
        <!-- <p class="hint">Geser foto langsung di kartu untuk mengatur posisi. Roda mouse atau tombol panah juga bisa dipakai.</p> -->
      </fieldset>

      <div class="actions">
        <button type="button" class="primary" id="dlPdf">Download PDF</button>
        <button type="button" id="dlPng">Download PNG</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button type="button" class="link" id="reset">Clear All Fields</button>
      </div>
    </form>

    <section class="stage" aria-label="Pratinjau kartu">
      <div class="card-box">
        <canvas id="card" width="2580" height="1632" aria-label="Pratinjau kartu member"></canvas>
        <div class="text-hit" id="hitName" tabindex="0" role="group" aria-label="Nama. Geser atau gunakan tombol panah untuk memindahkan." hidden></div>
        <div class="text-hit" id="hitNo" tabindex="0" role="group" aria-label="Member No. Geser atau gunakan tombol panah untuk memindahkan." hidden></div>
        <div class="photo-hit" id="hit" tabindex="0" role="slider" aria-label="Posisi foto. Geser atau gunakan tombol panah, plus dan minus untuk zoom."></div>
      </div>
      
      <div class="tools">
        <button type="button" class="link" id="posReset">Reset Text Positions</button>
        <button type="button" class="link" id="bgPick">Use Different Template </button>
        <button type="button" class="link" id="bgReset">Restore Default Template</button>
        <input type="file" id="bgFile" accept="image/png,image/jpeg,image/webp" class="sr" tabindex="-1">
      </div>
    </section>
  </div>
</div>

    if (!photo) return;
    var base = PHOTO.cover / Math.min(photo.w, photo.h);
    var dw = photo.w * base * photo.z, dh = photo.h * base * photo.z;
    var mx = Math.max(0, (dw - PHOTO.r * 2) / 2), my = Math.max(0, (dh - PHOTO.r * 2) / 2);
    photo.ox = Math.min(mx, Math.max(-mx, photo.ox));
    photo.oy = Math.min(my, Math.max(-my, photo.oy));
  }
  function drawPhoto(c) {
    if (!photo || !photo.img) {
      c.save(); c.beginPath(); c.arc(PHOTO.cx, PHOTO.cy, PHOTO.r, 0, Math.PI * 2);
      c.fillStyle = '#c4c4c4'; c.fill(); c.restore();
      return;
    }
    var base = PHOTO.cover / Math.min(photo.w, photo.h);
    var dw = photo.w * base * photo.z, dh = photo.h * base * photo.z;
    c.save();
    c.beginPath();
    c.arc(PHOTO.cx, PHOTO.cy, PHOTO.r, 0, Math.PI * 2);
    c.clip();
    c.drawImage(photo.img, PHOTO.cx - dw / 2 + photo.ox, PHOTO.cy - dh / 2 + photo.oy, dw, dh);
    c.restore();
  }

  // ---------- text ----------
  function wrapLines(c, text, maxW) {
    var words = text.split(/\s+/).filter(Boolean), lines = [], cur = '';
    words.forEach(function (w) {
      var t = cur ? cur + ' ' + w : w;
      if (cur && c.measureText(t).width > maxW) { lines.push(cur); cur = w; } else { cur = t; }
    });
    if (cur) lines.push(cur);
    return lines;
  }
  var offs = { name: { x: 0, y: 0 }, no: { x: 0, y: 0 } };
  var PILLBOX = { x: 32, y: 157, h: 13, minW: 91, maxW: 170 };
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
    c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
    c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r);
    c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r); c.closePath();
  }
  function clampOff(o, b) {
    o.x = Math.min(CW - 3 - (b.x + b.w), Math.max(3 - b.x, o.x));
    o.y = Math.min(CH - 3 - (b.y + b.h), Math.max(3 - b.y, o.y));
  }
  function layoutName(c, text) {
    text = text.trim().toUpperCase();
    if (!text) return null;
    var size, lines = [], font;
    for (size = NAME.size; size >= 10; size -= 0.5) {
      font = '700 ' + size + 'px "Cormorant Garamond", Georgia, "Times New Roman", serif';
      c.font = font;
      lines = wrapLines(c, text, NAME.maxW);
      var maxLines = size > 16.5 ? 2 : 3;
      var fits = lines.every(function (l) { return c.measureText(l).width <= NAME.maxW; });
      if (lines.length <= maxLines && fits) break;
    }
    c.font = font;
    var lh = NAME.lineH * (size / NAME.size), w = 0;
    lines.forEach(function (l) { w = Math.max(w, c.measureText(l).width); });
    var firstBase = NAME.baseline - (lines.length - 1) * lh;
    var top = firstBase - size * 0.72, bottom = NAME.baseline + size * 0.2;
    return { lines: lines, font: font, lh: lh, box: { x: NAME.x, y: top, w: w, h: bottom - top } };
  }
  function drawName(c, L, o) {
    if (!L) return;
    c.save();
    c.font = L.font;
    c.fillStyle = '#ffffff';
    c.textBaseline = 'alphabetic';
    c.textAlign = 'left';
    c.shadowColor = 'rgba(0,30,30,.30)';
    c.shadowBlur = 4 * S;
    c.shadowOffsetY = 2 * S;
    for (var i = 0; i < L.lines.length; i++) {
      c.fillText(L.lines[i], NAME.x + o.x, NAME.baseline + o.y - (L.lines.length - 1 - i) * L.lh);
    }
    c.restore();
  }
  function layoutPill(c, no) {
    var text = 'Member No.' + (no.trim() ? ' ' + no.trim() : '');
    var size = 6, tw;
    for (; size >= 4; size -= 0.25) {
      c.font = '600 ' + size + 'px Poppins, system-ui, Arial, sans-serif';
      tw = c.measureText(text).width;
      if (tw + 24 <= PILLBOX.maxW) break;
    }
    var pw = Math.max(PILLBOX.minW, tw + 24);
    return { text: text, size: size, pw: pw, box: { x: PILLBOX.x, y: PILLBOX.y, w: pw, h: PILLBOX.h } };
  }
  function drawPill(c, L, o) {
    var x = PILLBOX.x + o.x, y = PILLBOX.y + o.y, w = L.pw, h = PILLBOX.h;
    c.save();
    rr(c, x, y, w, h, 5);
    var fill = c.createLinearGradient(0, y, 0, y + h);
    fill.addColorStop(0, 'rgba(255,255,255,.20)');
    fill.addColorStop(1, 'rgba(255,255,255,.12)');
    c.fillStyle = fill; c.fill();
    rr(c, x + 0.35, y + 0.35, w - 0.7, h - 0.7, 4.7);
    var edge = c.createLinearGradient(0, y, 0, y + h);
    edge.addColorStop(0, 'rgba(215,255,250,.95)');
    edge.addColorStop(0.5, 'rgba(215,255,250,.22)');
    edge.addColorStop(1, 'rgba(215,255,250,.95)');
    c.lineWidth = 0.7; c.strokeStyle = edge; c.stroke();
    c.fillStyle = '#ffffff';
    c.font = '600 ' + L.size + 'px Poppins, system-ui, Arial, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'alphabetic';
    c.fillText(L.text, x + w / 2, y + 9);
    c.restore();
  }
  function drawDate(c, text, x) {
    if (!text) return;
    c.save();
    c.fillStyle = '#ffffff';
    c.textAlign = 'left';
    c.textBaseline = 'alphabetic';
    c.font = '400 7px Poppins, system-ui, Arial, sans-serif';
    setLS(c, 0.56);
    c.fillText(text, x, DATES.baseline);
    c.restore();
  }

  // ---------- render ----------
  var queued = false;
  function render() {
    queued = false;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (bgImg) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    drawPhoto(ctx);
    var nl = layoutName(ctx, $('name').value), pl = layoutPill(ctx, $('no').value);
    if (nl) clampOff(offs.name, nl.box);
    clampOff(offs.no, pl.box);
    drawPill(ctx, pl, offs.no);
    drawName(ctx, nl, offs.name);
    placeHit($('hitName'), nl && nl.box, offs.name);
    placeHit($('hitNo'), pl.box, offs.no);
    drawDate(ctx, fmtDate($('from').value), DATES.fromX);
    drawDate(ctx, fmtDate($('thru').value), DATES.thruX);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  function placeHit(el, b, o) {
    if (!b) { el.hidden = true; return; }
    el.hidden = false;
    var pad = 1.5;
    el.style.left = ((b.x + o.x - pad) / CW * 100) + '%';
    el.style.top = ((b.y + o.y - pad) / CH * 100) + '%';
    el.style.width = ((b.w + pad * 2) / CW * 100) + '%';
    el.style.height = ((b.h + pad * 2) / CH * 100) + '%';
  }
  function queue() { if (!queued) { queued = true; requestAnimationFrame(render); } }

  // ---------- form wiring ----------
  ['name', 'no'].forEach(function (id) { $(id).addEventListener('input', queue); });
  function syncThru() {
    var n = +$('years').value;
    if (n > 0) $('thru').value = addYears($('from').value, n);
    queue();
  }
  $('from').addEventListener('input', syncThru);
  $('years').addEventListener('change', syncThru);
  $('thru').addEventListener('input', function () { $('years').value = '0'; queue(); });

  function updateThumb() {
    $('thumb').style.backgroundImage = photo && photo.src ? 'url("' + photo.src + '")' : 'none';
    $('clearPhoto').style.visibility = photo ? 'visible' : 'hidden';
    $('zoom').disabled = !photo;
  }
  function setPhoto(img, src, z, ox, oy) {
    photo = { img: img, src: src, w: img.width || img.naturalWidth, h: img.height || img.naturalHeight, z: z || 1, ox: ox || 0, oy: oy || 0 };
    $('zoom').value = photo.z;
    clampPhoto();
    updateThumb();
    queue();
  }
  $('pick').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var done = function (img) {
      var url = URL.createObjectURL(f);
      setPhoto(img, url, 1, 0, 0);
      setStatus('Foto dimuat. Geser di kartu untuk mengatur posisi.');
    };
    var fail = function () { setStatus('File itu tidak bisa dibuka sebagai gambar. Coba JPG atau PNG.', true); };
    if (window.createImageBitmap) {
      createImageBitmap(f, { imageOrientation: 'from-image' }).then(done, function () {
        loadImage(URL.createObjectURL(f)).then(done, fail);
      });
    } else {
      loadImage(URL.createObjectURL(f)).then(done, fail);
    }
    this.value = '';
  });
  $('clearPhoto').addEventListener('click', function () { photo = null; updateThumb(); queue(); });
  $('zoom').addEventListener('input', function () {
    if (!photo) return;
    photo.z = +this.value; clampPhoto(); queue();
  });
  $('reset').addEventListener('click', function () {
    $('name').value = ''; $('no').value = ''; $('from').value = ''; $('thru').value = '';
    $('years').value = '3'; photo = null; updateThumb(); queue();
    setStatus('Semua isian dikosongkan.');
    $('name').focus();
  });

  // ---------- drag / wheel / keys on the photo ----------
  var hit = $('hit'), drag = null;
  function ptPerPx() { return CW / canvas.getBoundingClientRect().width; }
  hit.addEventListener('pointerdown', function (e) {
    if (!photo) { $('file').click(); return; }
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    hit.setPointerCapture(e.pointerId);
    hit.classList.add('dragging');
    e.preventDefault();
  });
  hit.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var k = ptPerPx();
    photo.ox += (e.clientX - drag.x) * k;
    photo.oy += (e.clientY - drag.y) * k;
    drag.x = e.clientX; drag.y = e.clientY;
    clampPhoto(); queue();
  });
  function endDrag(e) {
    if (drag && e.pointerId === drag.id) { drag = null; hit.classList.remove('dragging'); }
  }
  hit.addEventListener('pointerup', endDrag);
  hit.addEventListener('pointercancel', endDrag);
  hit.addEventListener('wheel', function (e) {
    if (!photo) return;
    e.preventDefault();
    photo.z = Math.min(3, Math.max(1, photo.z + (e.deltaY < 0 ? 0.05 : -0.05)));
    $('zoom').value = photo.z; clampPhoto(); queue();
  }, { passive: false });
  hit.addEventListener('keydown', function (e) {
    if (!photo) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } return; }
    var step = e.shiftKey ? 5 : 1, used = true;
    if (e.key === 'ArrowLeft') photo.ox -= step;
    else if (e.key === 'ArrowRight') photo.ox += step;
    else if (e.key === 'ArrowUp') photo.oy -= step;
    else if (e.key === 'ArrowDown') photo.oy += step;
    else if (e.key === '+' || e.key === '=') photo.z = Math.min(3, photo.z + 0.05);
    else if (e.key === '-') photo.z = Math.max(1, photo.z - 0.05);
    else used = false;
    if (used) { e.preventDefault(); $('zoom').value = photo.z; clampPhoto(); queue(); }
  });

  // ---------- drag text elements ----------
  function makeDraggable(el, off) {
    var d = null;
    el.addEventListener('pointerdown', function (e) {
      d = { id: e.pointerId, x: e.clientX, y: e.clientY };
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      el.focus();
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (!d || e.pointerId !== d.id) return;
      var k = ptPerPx();
      off.x += (e.clientX - d.x) * k;
      off.y += (e.clientY - d.y) * k;
      d.x = e.clientX; d.y = e.clientY;
      queue();
    });
    function end(e) { if (d && e.pointerId === d.id) { d = null; el.classList.remove('dragging'); } }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', function (e) {
      var s = e.shiftKey ? 3 : 0.5, used = true;
      if (e.key === 'ArrowLeft') off.x -= s;
      else if (e.key === 'ArrowRight') off.x += s;
      else if (e.key === 'ArrowUp') off.y -= s;
      else if (e.key === 'ArrowDown') off.y += s;
      else used = false;
      if (used) { e.preventDefault(); queue(); }
    });
  }
  makeDraggable($('hitName'), offs.name);
  makeDraggable($('hitNo'), offs.no);
  $('posReset').addEventListener('click', function () {
    offs.name.x = offs.name.y = offs.no.x = offs.no.y = 0;
    queue(); setStatus('Posisi nama dan Member No dikembalikan.');
  });

  // ---------- template swap ----------
  $('bgPick').addEventListener('click', function () { $('bgFile').click(); });
  $('bgFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    loadImage(URL.createObjectURL(f)).then(function (img) {
      var ratio = img.naturalWidth / img.naturalHeight;
      if (Math.abs(ratio - CW / CH) > 0.02) setStatus('Template dipakai, tapi rasionya berbeda dari 430 × 272 sehingga gambar akan meregang.', true);
      else setStatus('Template diganti.');
      bgImg = img; queue();
    }, function () { setStatus('Template tidak bisa dibaca. Pakai PNG, JPG atau WebP.', true); });
    this.value = '';
  });
  $('bgReset').addEventListener('click', function () {
    loadImage(DEFAULT_BG).then(function (img) { bgImg = img; queue(); setStatus('Template awal dikembalikan.'); });
  });

  // ---------- export ----------
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function baseName() {
    var n = ($('name').value.trim() + ' ' + $('no').value.trim()).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return 'Kartu-Member-' + (n || 'baru');
  }
  function enc(s) { return new TextEncoder().encode(s); }
  function concat(parts) {
    var n = 0; parts.forEach(function (p) { n += p.length; });
    var out = new Uint8Array(n), o = 0;
    parts.forEach(function (p) { out.set(p, o); o += p.length; });
    return out;
  }
  function toBlob(c, type, q) { return new Promise(function (r) { c.toBlob(r, type, q); }); }

  function buildPdf() {
    var w = canvas.width, h = canvas.height;
    var px = ctx.getImageData(0, 0, w, h).data;
    var alpha = new Uint8Array(w * h);
    for (var i = 0, j = 3; i < alpha.length; i++, j += 4) alpha[i] = px[j];
    var tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    var t = tmp.getContext('2d');
    t.fillStyle = '#ffffff'; t.fillRect(0, 0, w, h); t.drawImage(canvas, 0, 0);
    return toBlob(tmp, 'image/jpeg', 0.95).then(function (b) { return b.arrayBuffer(); }).then(function (ab) {
      var jpg = new Uint8Array(ab);
      if (window.CompressionStream) {
        var cs = new Blob([alpha]).stream().pipeThrough(new CompressionStream('deflate'));
        return new Response(cs).arrayBuffer().then(function (m) { return { jpg: jpg, mask: new Uint8Array(m), flate: true }; });
      }
      return { jpg: jpg, mask: alpha, flate: false };
    }).then(function (d) {
      var title = ($('name').value.trim() || 'Kartu Member').replace(/[()\\]/g, '');
      var page = 'q ' + CW + ' 0 0 ' + CH + ' 0 0 cm /Im0 Do Q';
      var objs = [
        enc('<< /Type /Catalog /Pages 2 0 R >>'),
        enc('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'),
        enc('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + CW + ' ' + CH + '] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>'),
        concat([enc('<< /Length ' + page.length + ' >>\nstream\n'), enc(page), enc('\nendstream')]),
        concat([enc('<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /SMask 6 0 R /Length ' + d.jpg.length + ' >>\nstream\n'), d.jpg, enc('\nendstream')]),
        concat([enc('<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceGray /BitsPerComponent 8 ' + (d.flate ? '/Filter /FlateDecode ' : '') + '/Length ' + d.mask.length + ' >>\nstream\n'), d.mask, enc('\nendstream')]),
        enc('<< /Title (' + title + ') /Producer (Laguna Member Card) >>')
      ];
      var parts = [enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')], offsets = [], pos = parts[0].length;
      objs.forEach(function (o, k) {
        offsets.push(pos);
        var head = enc((k + 1) + ' 0 obj\n'), tail = enc('\nendobj\n');
        parts.push(head, o, tail);
        pos += head.length + o.length + tail.length;
      });
      var xref = 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
      offsets.forEach(function (o) { xref += ('0000000000' + o).slice(-10) + ' 00000 n \n'; });
      xref += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R /Info 7 0 R >>\nstartxref\n' + pos + '\n%%EOF\n';
      parts.push(enc(xref));
      return new Blob([concat(parts)], { type: 'application/pdf' });
    });
  }
  window.__buildPdf = buildPdf;
  window.__app = { offs: offs, queue: queue, render: render };

  function busy(btn, on) { btn.disabled = on; }
  $('dlPdf').addEventListener('click', function () {
    var btn = this; busy(btn, true); setStatus('Menyiapkan PDF…');
    render();
    buildPdf().then(function (blob) {
      download(blob, baseName() + '.pdf');
      setStatus('PDF diunduh: ' + baseName() + '.pdf');
    }).catch(function (err) {
      setStatus('PDF gagal dibuat: ' + err.message, true);
    }).then(function () { busy(btn, false); });
  });
  $('dlPng').addEventListener('click', function () {
    var btn = this; busy(btn, true);
    render();
    toBlob(canvas, 'image/png').then(function (b) {
      download(b, baseName() + '.png');
      setStatus('PNG diunduh: ' + baseName() + '.png');
    }).then(function () { busy(btn, false); });
  });

  // ---------- boot ----------
  $('gf').addEventListener('error', function () {
    setStatus('Font Cormorant dan Poppins belum termuat (perlu internet). Tampilan huruf di kartu bisa berbeda dari desain asli.', true);
  });
  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var specs = ['700 23px "Cormorant Garamond"', '600 6px Poppins', '400 7px Poppins'];
    var all = Promise.all(specs.map(function (s) { return document.fonts.load(s, 'ALFIE 0123456789/'); }));
    var timeout = new Promise(function (r) { setTimeout(r, 3500); });
    return Promise.race([all, timeout]);
  }
  Promise.all([loadImage(DEFAULT_BG), loadImage(EXAMPLE_PHOTO)]).then(function (r) {
    bgImg = r[0];
    setPhoto(r[1], EXAMPLE_PHOTO, 1, 0, 12.9);
    render();
    return fontsReady();
  }).then(function () { render(); window.__ready = true; });
  if (document.fonts) document.fonts.addEventListener('loadingdone', queue);
})();
</script>
</body>
</html>
